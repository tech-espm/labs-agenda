version: '3.7'
services:
  db:
    image: mysql:8.0.19
    container_name: labsagenda-mysql
    command: '--default-authentication-plugin=mysql_native_password'
    restart: on-failure
    secrets:
      - db-password
    volumes:
      - labsagenda-db-data:/var/lib/mysql
    networks:
      - labsagenda-privada
    environment:
      - MYSQL_DATABASE=labsagenda
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password

  app:
    image: labsagenda:1.0.4
    container_name: labsagenda
    # build can be specified either as a string containing a path to the build context
    # build: ./dir
    # or as an object with the path specified under context and optionally Dockerfile:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      # Argumentos passados para o Dockerfile
      args:
        - NODE_ENV=production
        - PORT=3000
    restart: always
    environment:
      - PORT=3000
      - DATABASE_HOST=db
      - DATABASE_PASSWORD=/run/secrets/db-password
      - NODE_ENV=production
    ports:
      - 3000:3000
    secrets:
      - db-password
    volumes:
      - ./assets:/usr/app/assets
      - labsagenda-dados:/usr/app/resources/dados
    networks:
      - labsagenda-privada
    depends_on:
      - db

networks:
  labsagenda-privada:

volumes:
  labsagenda-db-data:
  labsagenda-dados:

secrets:
  db-password:
    # CUIDADO para não salvar o arquivo com uma quebra de linha ao final!!!
    file: docker/db/password.txt
